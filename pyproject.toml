[project]
name = "psygnal"
version = "0.1.0"
description = "PSYGRID Forex Psygnal Psync - highly psychic intelligence engine for M5-native forex/metals/oil market forecasting"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["psygnal*"]
